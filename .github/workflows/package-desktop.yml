name: Package Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/package-desktop.yml'
      - 'scripts/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/build-hooks/**'
      - 'apps/desktop/src/main/**'
      - 'packages/infrastructure/src/export/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PANDOC_VERSION: '3.1.11.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            package_script: package:linux:all
            artifact_glob: |
              build/desktop/*.AppImage
              build/desktop/*.deb
              build/desktop/*.rpm
          - os: windows-2022
            label: Windows
            package_script: package:win
            artifact_glob: |
              build/desktop/doku_v*-setup.exe
              build/desktop/doku_v*-portable.zip
          - os: macos-14
            label: macOS
            package_script: package:mac
            artifact_glob: build/desktop/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Setup Python
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Linux runtime and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Jammy provides libharfbuzz0b; WeasyPrint 66 uses bundled FontTools for subsetting.
          sudo apt-get install -y fakeroot dpkg rpm binutils bubblewrap python3-venv libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b texlive-luatex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Install pinned Pandoc
        if: runner.os == 'Linux'
        # Jammy only offers Pandoc 2.9, whose Lua API lacks the current Table
        # AST and `walk`, so the bundled table filter cannot run. Windows and
        # macOS get Pandoc 3 from choco/brew; pin the same generation here.
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install Windows native libraries
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-pango mingw-w64-x86_64-harfbuzz mingw-w64-x86_64-fontconfig

      - name: Configure Windows native bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DOKU_WEASY_DLL_DIR=${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_ENV
          choco install pandoc --no-progress -y
          "C:\Program Files\Pandoc" >> $env:GITHUB_PATH
          "DOKU_PANDOC_BIN=C:\Program Files\Pandoc\pandoc.exe" >> $env:GITHUB_ENV

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 pango harfbuzz fontconfig pandoc
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"

      - name: Install portable TeX Live
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install TeX packages used by PDF export
        if: runner.os != 'Linux'
        run: tlmgr install collection-luatex collection-latexrecommended collection-latexextra collection-fontsrecommended

      - name: Unit tests
        if: runner.os == 'Linux'
        run: npm test

      - name: Packaging regression tests
        if: runner.os == 'Linux'
        run: npm run test:packaging

      - name: Portable runtime unit tests
        if: runner.os != 'Linux'
        run: npm test -- apps/desktop/src/main/portableData.test.ts apps/desktop/src/main/exportRuntime.test.ts packages/infrastructure/src/export/pdfTypography.test.ts

      - name: Embedded Bootstrap icons are in sync
        run: npm run icons:bootstrap:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build and certify packages
        env:
          DOKU_SMOKE_ISOLATE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: npm run ${{ matrix.package_script }}

      - name: Verify Windows portable archive and installer launch
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows-launcher.cjs

      - name: Upload certified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doku-${{ matrix.label }}-artifacts
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doku-${{ matrix.label }}-diagnostics
          path: |
            build/desktop/builder-debug.yml
            build/desktop/builder-effective-config.yaml
            build/smoke-diagnostics/**
          if-no-files-found: ignore

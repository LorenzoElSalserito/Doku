name: Release Candidate QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rc-qa:
    name: RC QA (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          # Jammy provides libharfbuzz0b; WeasyPrint 66 uses bundled FontTools for subsetting.
          sudo apt-get install -y fakeroot dpkg rpm binutils bubblewrap python3-venv libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b pandoc texlive-luatex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and packaging tests
        run: npm test && npm run test:packaging

      - name: Package Linux
        env:
          DOKU_SMOKE_ISOLATE: '1'
        run: npm run package:linux:all

      - name: Upload Linux RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doku-rc-linux-artifacts
          path: |
            build/desktop/*.deb
            build/desktop/*.rpm
            build/desktop/*.AppImage
          if-no-files-found: error
